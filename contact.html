<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="project.html">Projects</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="contact-page">
    <section class="contact-card">
        <h1>Contact Us</h1>
        <p>Have a question or need support? Fill out the form below and we will get back to you soon.</p>

        <form class="contact-form" action="#" method="post">
            <p class="required-note">* indicates required fields</p>

            <div class="form-row">
                <label for="name">Name <span aria-label="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-row">
                <label for="email">Email <span aria-label="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-row">
                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                    <option value="">Select a topic</option>
                    <option value="help">Help</option>
                    <option value="tech-support">Tech Support</option>
                    <option value="billing">Billing</option>
                </select>
            </div>

            <div class="form-row">
                <label for="message">Message <span aria-label="required">*</span></label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
            </div>

            <div class="submit-row">
                <button type="submit">Submit</button>
            </div>
        </form>
    </section>
</main>

<footer>
    &copy; 2026 My Website
</footer>

</body>
</html>
